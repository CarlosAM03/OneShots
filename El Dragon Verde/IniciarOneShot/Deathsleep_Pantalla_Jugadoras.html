<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#030504"><title>Deathsleep · Pantalla de jugadoras</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#030504;color:#cfc9b8}body{font-family:system-ui,Segoe UI,sans-serif;overflow:hidden;display:flex;flex-direction:column}header{height:43px;flex:0 0 43px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 12px;background:#09120df2;border-bottom:1px solid #354534}header strong{font:normal .88rem Georgia,serif;letter-spacing:.13em;color:#dbba81}header button{background:#263b2b;color:#f4e9d0;padding:7px 13px;border-radius:7px;border:1px solid #667958;font:600 .76rem system-ui;cursor:pointer}main{flex:1;display:grid;place-items:center;min-height:0;position:relative}img{display:block;max-width:100vw;max-height:calc(100vh - 43px);width:auto;height:auto;object-fit:contain}#error{display:none;color:#cbbdab;padding:25px;text-align:center;max-width:630px;line-height:1.8}#error b{color:#dfbe80}footer{position:absolute;bottom:10px;right:12px;color:#cbbd9d;opacity:0;pointer-events:none}body:hover footer{opacity:.65}@media(max-width:600px){header strong{font-size:.73rem}header button{padding:5px 8px}}@media (display-mode:fullscreen){header{display:none}img{max-height:100vh}}
</style></head><body><header id="controls"><strong>DEATHSLEEP · EL DRAGÓN ENTRE NOSOTROS</strong><span><button id="dark">Oscurecer</button> <button id="fullscreen">Pantalla completa</button></span></header><main id="stage"><img id="image" alt="Ilustración de la escena" style="display:none"><div id="error"><b>No fue posible cargar la ilustración.</b><p>Comprueba que el archivo existe en la carpeta <code>imagenes</code> junto al HTML del panel del DM y que su nombre coincide exactamente, incluidos acentos y espacios.</p></div></main><footer>Deathsleep · imagen de escena</footer><script>
let params=new URLSearchParams(location.search),raw=params.get('img')||'';let image=document.getElementById('image'),error=document.getElementById('error');
if(!raw||raw.includes('://')||raw.startsWith('/')||raw.includes('..')||!(raw.startsWith('imagenes/')||raw.startsWith('Mapa '))){error.style.display='block'}else{image.onload=()=>{image.style.display='block';error.style.display='none'};image.onerror=()=>{image.style.display='none';error.style.display='block'};image.src=new URL(raw.split('/').map(encodeURIComponent).join('/'),location.href).href;}
document.getElementById('dark').addEventListener('click',()=>{const isDark=image.style.visibility==='hidden';image.style.visibility=isDark?'visible':'hidden';document.getElementById('dark').textContent=isDark?'Oscurecer':'Mostrar imagen'});document.getElementById('fullscreen').addEventListener('click',()=>{document.documentElement.requestFullscreen?.().catch(()=>{})});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.fullscreenElement)document.exitFullscreen();else window.close()}if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.().catch(()=>{});if(e.key===' '){e.preventDefault();document.getElementById('dark').click()}});
</script></body></html>
